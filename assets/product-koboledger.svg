<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">KoboLedger everyday money overview</title>
  <desc id="desc">A simple illustrated dashboard showing money in, money out, money set aside and recent entries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10172d"/><stop offset="1" stop-color="#073a36"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="shadow" x="-.1" y="-.1" width="1.2" height="1.3"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#07111f" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="720" rx="34" fill="#f3f6fa"/>
  <rect x="0" y="0" width="1200" height="148" rx="34" fill="url(#bg)"/>
  <path d="M0 116h1200v32H0z" fill="url(#bg)"/>
  <circle cx="83" cy="74" r="35" fill="#ffc52e"/><circle cx="83" cy="74" r="28" fill="#10203a"/>
  <text x="70" y="87" font-family="Arial,sans-serif" font-size="39" font-weight="800" fill="#fff">J</text>
  <text x="137" y="70" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">KoboLedger</text>
  <text x="137" y="98" font-family="Arial,sans-serif" font-size="16" fill="#c6d3e2">Your money, made easier to follow</text>
  <rect x="1024" y="49" width="124" height="46" rx="23" fill="#ffffff" fill-opacity=".12"/>
  <text x="1050" y="78" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Today</text>
  <text x="62" y="202" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#14213a">A clear view of your money</text>
  <text x="62" y="229" font-family="Arial,sans-serif" font-size="15" fill="#718096">What came in, what went out, and what you set aside</text>
  <g filter="url(#shadow)">
    <rect x="58" y="258" width="340" height="174" rx="22" fill="#fff"/>
    <rect x="430" y="258" width="340" height="174" rx="22" fill="#fff"/>
    <rect x="802" y="258" width="340" height="174" rx="22" fill="url(#bg)"/>
  </g>
  <circle cx="98" cy="303" r="19" fill="#e8faf2"/><path d="M98 313v-20m-8 8 8-8 8 8" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="131" y="309" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#718096">MONEY IN</text>
  <text x="85" y="372" font-family="Arial,sans-serif" font-size="37" font-weight="800" fill="#10172d">₦245,000</text>
  <text x="85" y="405" font-family="Arial,sans-serif" font-size="14" fill="#718096">Sales and other money received</text>
  <circle cx="470" cy="303" r="19" fill="#fff1f1"/><path d="M470 293v20m-8-8 8 8 8-8" fill="none" stroke="#e11d48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="503" y="309" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#718096">MONEY OUT</text>
  <text x="457" y="372" font-family="Arial,sans-serif" font-size="37" font-weight="800" fill="#10172d">₦86,500</text>
  <text x="457" y="405" font-family="Arial,sans-serif" font-size="14" fill="#718096">Expenses and bills paid</text>
  <circle cx="842" cy="303" r="19" fill="#ffffff" fill-opacity=".12"/><path d="m834 303 6 6 11-13" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="875" y="309" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#c6d3e2">SET ASIDE</text>
  <text x="829" y="372" font-family="Arial,sans-serif" font-size="37" font-weight="800" fill="#fff">₦40,000</text>
  <text x="829" y="405" font-family="Arial,sans-serif" font-size="14" fill="#c6d3e2">Savings and upcoming plans</text>
  <rect x="58" y="462" width="700" height="205" rx="22" fill="#fff" filter="url(#shadow)"/>
  <text x="88" y="505" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14213a">Recent entries</text>
  <text x="640" y="504" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#059669">View your records →</text>
  <path d="M88 526h640M88 572h640M88 620h640" stroke="#e7edf3" stroke-width="2"/>
  <circle cx="105" cy="550" r="7" fill="#10b981"/><text x="126" y="556" font-family="Arial,sans-serif" font-size="15" fill="#29374d">Market sales</text><text x="662" y="556" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#059669">+₦32,000</text>
  <circle cx="105" cy="596" r="7" fill="#f43f5e"/><text x="126" y="602" font-family="Arial,sans-serif" font-size="15" fill="#29374d">Transport</text><text x="662" y="602" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#e11d48">−₦2,500</text>
  <circle cx="105" cy="644" r="7" fill="#f59e0b"/><text x="126" y="650" font-family="Arial,sans-serif" font-size="15" fill="#29374d">Weekly savings</text><text x="662" y="650" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b7791f">₦5,000</text>
  <rect x="790" y="462" width="352" height="205" rx="22" fill="#e8faf2"/>
  <circle cx="833" cy="509" r="20" fill="#fff"/><path d="M833 496v13l9 6" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="867" y="515" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#14213a">A task for today</text>
  <text x="824" y="563" font-family="Arial,sans-serif" font-size="16" fill="#29374d">Pay the electricity bill</text>
  <text x="824" y="591" font-family="Arial,sans-serif" font-size="14" fill="#718096">Reminder set for 4:00 pm</text>
  <rect x="824" y="615" width="284" height="34" rx="17" fill="url(#green)"/>
  <text x="908" y="638" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Simple daily reminders</text>
</svg>

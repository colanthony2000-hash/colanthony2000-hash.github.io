name: Validate parent site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site structure and publishing standards
        run: node scripts/validate-site.cjs
      - name: Validate long-form global guides
        run: node scripts/validate-global-guides.cjs
